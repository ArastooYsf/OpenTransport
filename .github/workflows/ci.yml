name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Format, analyze, and test (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate data models (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format lib/ test/ --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  validate-data:
    name: Validate transit data against schema.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate every data/<country>/<city>.json file
        run: python3 scripts/validate_data.py
