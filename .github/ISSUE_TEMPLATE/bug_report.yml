name: Bug report
description: Something in the app is broken or behaving unexpectedly.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much
        as you can — it makes this reproducible (and fixable) much faster.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I tap on a station, the app crashes / shows a blank screen / ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: locale
    attributes:
      label: App language / locale you were using
      placeholder: fa (Persian) / en (English) / other
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version / commit hash
      placeholder: e.g. v0.1.0, or the git commit if running from source
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack trace
      description: Output of `flutter logs`, a crash log, or a screenshot. This will be formatted as code automatically.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't been reported already.
          required: true
        - label: This is a bug in the app/code, not incorrect transit data (use the "New/incorrect transit data" template for that).
          required: true
